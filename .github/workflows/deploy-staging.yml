name: Publish and deploy VPS staging

on:
  push:
    branches:
      - main

concurrency:
  group: frontend-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish staging image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/wipramgamurci/fe-lumbung-mesari:staging-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ github.actor }}

    steps:
      - name: Deploy immutable staging image to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USERNAME
          script: |
            set -euo pipefail
            SOURCE_SHA='${{ github.sha }}'
            IMAGE_REF='ghcr.io/wipramgamurci/fe-lumbung-mesari@${{ needs.publish.outputs.image_digest }}'
            STAGING_DIR="$HOME/apps/fe-lumbung-mesari-staging"
            if [[ ! -d "$STAGING_DIR/.git" ]]; then
              git clone https://github.com/wipramgamurci/fe-lumbung-mesari.git "$STAGING_DIR"
            fi
            cd "$STAGING_DIR"
            git fetch origin main
            git checkout --detach "$SOURCE_SHA"
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            bash deployment/deploy-staging.sh "$IMAGE_REF"
